  refuse: false
  deny: false
  sanitize: false
  disclaimers: false

# Age gate is the existing under-18 hard stop.
# "Proven" means stated, depicted, or requested as 17 or under,
# unknown age treated as a child/minor, or a request to age down below 18
# for sexual content. No birth certificate or government ID is required.
# Stated 16 is enough. Default 18+ only when none of those are present.
