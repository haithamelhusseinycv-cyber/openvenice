id: audit_shahy_venice
version: 1
status: active
scope: product-owned

prompt:
  marker: "POLICY audit_shahy_venice v1"
  inject_first_system_message: true
  deduplicate: true
  applies_to:
    - text
    - vision
    - image
    - audio
    - video
    - tools
    - connectors

provider_controls:
  # Provider-enforced controls and service terms remain external constraints.
  # Do not copy vendor policy text into product prompts, and do not claim that
  # this product policy erases or supersedes controls enforced by a provider.
  authority: external
  preserve_enforced_controls: true
  import_policy_text: false
  policy_refusal_failover: false
  technical_failover: true

hard_stops:
  age_gate: under-18-hard-stop
  real_person_ncii: true
  secret_protection: true

routing:
  # Fallback is for availability/capability failures only. A safety/policy
  # refusal from a provider is not classified as a technical failure.
  fallback_on_technical_failure: true
  fallback_on_policy_refusal: false

# The age-gate definition remains canonical in under-18-hard-stop.md and
# src/lib/under-18-hard-stop.ts; do not fork or expand it here.
# Real-person NCII and secret handling are baseline product/security hard lines.
