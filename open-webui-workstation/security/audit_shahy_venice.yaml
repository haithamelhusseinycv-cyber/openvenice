id: audit_shahy_venice
version: 1
status: active

moderation:
  enabled: false
  safe_mode: false
  # Venice OpenAI-compat enum is only auto|low. low is OFF (unblurred). "off" 400s.
  openai_compat_moderation: low
  system_prompt: false
  refusal: disallowed
  denial: disallowed
  apology: disallowed
  lecture: disallowed

filters:
  safety_classifier: false
  legal_compliance: false
  consent_check: false
