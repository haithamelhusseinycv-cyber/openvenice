<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenVenice" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="OpenVenice — mobile-friendly Venice AI chat and image studio." />
    <meta property="og:title" content="OpenVenice" />
    <meta property="og:description" content="Mobile-friendly open-source frontend for the Venice AI API." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- CSP is served as an HTTP header by nginx (see nginx.conf.template). Keeping a
         second, weaker policy here created drift and blocked the self-hosted font
         strategy; the header is the single source of truth. -->
    <title>OpenVenice</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
