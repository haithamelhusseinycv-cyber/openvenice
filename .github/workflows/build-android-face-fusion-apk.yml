name: Build Android Face Fusion Complete Models APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-face-fusion-apk.yml'
      - 'android-face-fusion-custom/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      # Keep the same debug signing identity so Android can update v2/v3 in place.
      - name: Restore stable debug signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.android/debug.keystore
          key: android-face-fusion-debug-keystore-v2

      - name: Clone build customizations
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/haithamelhusseinycv-cyber/openvenice.git build-host
          cp -R build-host/android-face-fusion-custom ./android-face-fusion-custom

      - name: Clone Android Face Fusion
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/Parasaran-Python/android-face-fusion.git android-face-fusion

      - name: Apply Complete Models customization
        shell: bash
        run: |
          python3 android-face-fusion-custom/apply_custom.py
          python3 android-face-fusion-custom/fix_downloads_v31.py

      - name: Build debug APK
        working-directory: android-face-fusion
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f android-face-fusion/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-face-fusion/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Complete Models APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-face-fusion-complete-models-apk
          path: android-face-fusion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
