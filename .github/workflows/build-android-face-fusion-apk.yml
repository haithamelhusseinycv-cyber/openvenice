name: Chilli FaceFusion stable signed release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-face-fusion-apk.yml'
      - 'android-face-fusion-custom/**'
      - 'android-openvenice-custom/pin_debug_signing.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout OpenVenice customization source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone pinned Android Face Fusion
        shell: bash
        env:
          FACEFUSION_UPSTREAM_SHA: f38a70e4bacaab4132538421c471f9d4d3ccac00
        run: |
          git clone --no-checkout https://github.com/Parasaran-Python/android-face-fusion.git android-face-fusion
          git -C android-face-fusion checkout --detach "$FACEFUSION_UPSTREAM_SHA"
          test "$(git -C android-face-fusion rev-parse HEAD)" = "$FACEFUSION_UPSTREAM_SHA"

      - name: Apply Complete Models customization
        shell: bash
        run: |
          python3 android-face-fusion-custom/apply_custom.py
          python3 android-face-fusion-custom/fix_downloads_v31.py
          python3 android-face-fusion-custom/apply_agent_bridge.py
          python3 android-face-fusion-custom/improve_mobile_v42.py

      - name: Verify agent bridge manifest
        shell: bash
        run: |
          grep -q 'ai.openvenice.permission.FACEFUSION_AGENT' android-face-fusion/app/src/main/AndroidManifest.xml
          grep -q 'AgentBridgeService' android-face-fusion/app/src/main/AndroidManifest.xml
          grep -q '199E28A4FFACFAE81EBCBCD21E09691751CF2F77FE79B951BF043722C88734F2' android-face-fusion/app/src/main/res/values/openvenice_known_certs.xml
          test -f android-face-fusion/app/src/main/java/com/pv/androidfacefusion/AgentBridgeService.java

      - name: Add on-device processing test
        run: |
          mkdir -p android-face-fusion/app/src/androidTest/java/com/pv/androidfacefusion android-face-fusion/app/src/androidTest/assets
          cp android-face-fusion-custom/FaceFusionSmoke.java android-face-fusion/app/src/androidTest/java/com/pv/androidfacefusion/
          sed -i 's/testInstrumentationRunner = .*/testInstrumentationRunner = "com.pv.androidfacefusion.FaceFusionSmoke"/' android-face-fusion/app/build.gradle.kts
          curl -fL --retry 2 https://raw.githubusercontent.com/scikit-image/scikit-image/v0.19.3/skimage/data/astronaut.png -o android-face-fusion/app/src/androidTest/assets/astronaut.png
          curl -fL --retry 2 https://raw.githubusercontent.com/matplotlib/matplotlib/v3.9.2/lib/matplotlib/mpl-data/sample_data/grace_hopper.jpg -o android-face-fusion/app/src/androidTest/assets/grace_hopper.jpg

      - name: Build release and on-device test APK
        working-directory: android-face-fusion
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          rm -f gradle/gradle-daemon-jvm.properties
          chmod +x ./gradlew
          ./gradlew assembleRelease assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Sign with permanent Chilli identity
        shell: bash
        env:
          CHILLI_KEYSTORE: ${{ secrets.CHILLI_RELEASE_KEYSTORE_BASE64 }}
          CHILLI_STORE_PASSWORD: ${{ secrets.CHILLI_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CHILLI_KEYSTORE"
          test -n "$CHILLI_STORE_PASSWORD"
          printf '%s' "$CHILLI_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/chilli-release.jks"
          chmod 600 "$RUNNER_TEMP/chilli-release.jks"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          source=$(find android-face-fusion/app/build/outputs/apk/release -name '*.apk' | head -1)
          test_apk=$(find android-face-fusion/app/build/outputs/apk/androidTest/debug -name '*.apk' | head -1)
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/chilli-release.jks" --ks-key-alias chilli-release --ks-pass env:CHILLI_STORE_PASSWORD --out Chilli-FaceFusion-4.5-release.apk "$source"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/chilli-release.jks" --ks-key-alias chilli-release --ks-pass env:CHILLI_STORE_PASSWORD --out Chilli-FaceFusion-native-test.apk "$test_apk"
          "$tools/apksigner" verify --print-certs Chilli-FaceFusion-4.5-release.apk | tee "$RUNNER_TEMP/cert.txt"
          grep -q '199e28a4ffacfae81ebcbcd21e09691751cf2f77fe79b951bf043722c88734f2' "$RUNNER_TEMP/cert.txt"
          "$tools/aapt2" dump badging Chilli-FaceFusion-4.5-release.apk > "$RUNNER_TEMP/badging.txt"
          ! grep -q application-debuggable "$RUNNER_TEMP/badging.txt"
          "$tools/zipalign" -c -p 4 Chilli-FaceFusion-4.5-release.apk
          sha256sum Chilli-FaceFusion-4.5-release.apk > Chilli-FaceFusion-4.5-release.apk.sha256
          rm "$RUNNER_TEMP/chilli-release.jks"

      - name: Upload Complete Models APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chilli-facefusion-stable-release
          path: |
            Chilli-FaceFusion-4.5-release.apk
            Chilli-FaceFusion-4.5-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload on-device test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: facefusion-on-device-test-apk
          path: Chilli-FaceFusion-native-test.apk
          if-no-files-found: error
          retention-days: 14
