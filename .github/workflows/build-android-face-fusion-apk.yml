name: Build Android Face Fusion APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-face-fusion-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone Android Face Fusion
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/Parasaran-Python/android-face-fusion.git android-face-fusion

      - name: Build debug APK
        working-directory: android-face-fusion
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -f android-face-fusion/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-face-fusion/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-face-fusion-debug-apk
          path: android-face-fusion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
