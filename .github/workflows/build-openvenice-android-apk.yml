name: Build OpenVenice Android Agent APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-openvenice-android-apk.yml'
      - 'android-openvenice-custom/**'
      - 'capacitor.config.json'
      - 'src/**'
      - 'services/voicetut-api/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Configure repository variable VOICETUT_BASE_URL once a GPU service is deployed.
      # Leaving it empty is safe: Noor automatically falls back to Venice/Serena.
      VITE_VOICETUT_BASE_URL: ${{ vars.VOICETUT_BASE_URL }}

    steps:
      - name: Checkout OpenVenice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      # This is intentionally the same cache key used by the FaceFusion build.
      # Android signature-level IPC will fail if these APKs are signed by
      # different certificates.
      - name: Restore shared Android signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.android/debug.keystore
          key: android-face-fusion-debug-keystore-v2

      - name: Ensure shared signing key exists
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:'

      - name: Install web dependencies
        run: npm ci

      - name: Verify web app
        run: |
          npm run lint
          npm run build

      # Capacitor is a packaging dependency for the Android artifact. It stays
      # outside the web runtime dependency graph so the existing PWA build and
      # package lock remain stable.
      - name: Install Capacitor packaging toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Capacitor Android project
        shell: bash
        env:
          OPENVENICE_DEBUG_KEYSTORE: /home/runner/.android/debug.keystore
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          python3 android-openvenice-custom/apply_android_agent.py
          python3 android-openvenice-custom/pin_debug_signing.py android/app/build.gradle

      - name: Verify Android agent shell
        shell: bash
        run: |
          manifest='android/app/src/main/AndroidManifest.xml'
          grep -q 'ai.openvenice.permission.FACEFUSION_AGENT' "$manifest"
          grep -q 'android.permission.RECORD_AUDIO' "$manifest"
          grep -q 'android.speech.RecognitionService' "$manifest"
          grep -q 'android.intent.action.TTS_SERVICE' "$manifest"
          grep -q 'com.pv.androidfacefusion' "$manifest"
          grep -q '${applicationId}.fileprovider' "$manifest"
          grep -q 'network_security_config' "$manifest"
          grep -q 'openVeniceStableDebug' android/app/build.gradle
          test -f android/app/src/main/java/ai/openvenice/app/FaceFusionAgentPlugin.java
          test -f android/app/src/main/java/ai/openvenice/app/MediaActionsPlugin.java
          test -f android/app/src/main/java/ai/openvenice/app/VoiceChatPlugin.java
          grep -q 'registerPlugin(FaceFusionAgentPlugin.class)' android/app/src/main/java/ai/openvenice/app/MainActivity.java
          grep -q 'registerPlugin(MediaActionsPlugin.class)' android/app/src/main/java/ai/openvenice/app/MainActivity.java
          grep -q 'registerPlugin(VoiceChatPlugin.class)' android/app/src/main/java/ai/openvenice/app/MainActivity.java

      - name: Build debug APK
        working-directory: android
        shell: bash
        env:
          OPENVENICE_DEBUG_KEYSTORE: /home/runner/.android/debug.keystore
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK and signing identity
        shell: bash
        run: |
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          test -f "$apk"
          ls -lh "$apk"
          "$apksigner" verify --print-certs "$apk"

          expected=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual=$("$apksigner" verify --print-certs "$apk" | awk '/certificate SHA-256 digest:/{print $NF; exit}' | tr '[:upper:]' '[:lower:]')
          echo "Expected signer: $expected"
          echo "APK signer:      $actual"
          test -n "$expected"
          test "$expected" = "$actual"

      - name: Upload OpenVenice Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openvenice-android-agent-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
