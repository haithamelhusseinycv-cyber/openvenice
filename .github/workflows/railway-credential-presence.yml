name: Railway Credential Presence Diagnostic

on:
  push:
    branches:
      - railway-config-diagnose-20260906

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RAILWAY_TOKEN_VALUE: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN_VALUE: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_TOKEN_VALUE: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
    steps:
      - name: Report credential names only
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "RAILWAY_TOKEN:$RAILWAY_TOKEN_VALUE" \
            "RAILWAY_API_TOKEN:$RAILWAY_API_TOKEN_VALUE" \
            "RAILWAY_PROJECT_TOKEN:$RAILWAY_PROJECT_TOKEN_VALUE"; do
            name=${pair%%:*}
            value=${pair#*:}
            if [ -n "$value" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=ABSENT"
            fi
          done
