name: Deploy Open WebUI to RunPod

on:
  push:
    branches:
      - ops/runpod-openwebui-20260904
    paths:
      - .github/workflows/runpod-openwebui-deploy.yml

permissions:
  contents: read

concurrency:
  group: runpod-openwebui-20260904
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY_RAW: ${{ secrets.RUNPOD_API_KEY || secrets.RUNPOD_KEY || secrets.RUNPOD_TOKEN }}
      POD_NAME: open-webui-v0-11-1-cpu-20260904
      IMAGE: ghcr.io/open-webui/open-webui:v0.11.1
      KNOWN_TASK_POD_ID: at0lgrx9aqiypm
    steps:
      - name: Normalize and validate RunPod credential
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNPOD_API_KEY_RAW:-}"
          if [ -z "$raw" ]; then
            echo "No RunPod Actions secret found."
            exit 10
          fi
          key=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Aa]uthorization:[[:space:]]*//; s/^[[:space:]]*[Bb]earer[[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')
          if [ -z "$key" ]; then
            echo "RunPod secret became empty after normalization."
            exit 11
          fi
          echo "::add-mask::$key"
          echo "RUNPOD_API_KEY=$key" >> "$GITHUB_ENV"
          echo "RunPod credential normalized without exposing it."

      - name: Snapshot existing RunPod workloads
        shell: bash
        run: |
          set -euo pipefail
          http=$(curl -sS --max-time 20 -o /tmp/pods-before.json -w '%{http_code}' \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            https://rest.runpod.io/v1/pods)
          if [ "$http" != "200" ]; then
            echo "RunPod list-pods authentication/read check failed: HTTP $http"
            cat /tmp/pods-before.json 2>/dev/null | head -c 1000 || true
            echo
            exit 12
          fi
          count=$(jq 'if type=="array" then length else (.pods // [] | length) end' /tmp/pods-before.json)
          echo "Existing pod count: $count"
          jq -r 'if type=="array" then .[] else (.pods // [])[] end | [.id,.name,.desiredStatus,(.imageName // .image // "")] | @tsv' /tmp/pods-before.json || true

      - name: Select or create isolated CPU Open WebUI pod
        id: target
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(jq -r --arg n "$POD_NAME" 'if type=="array" then .[] else (.pods // [])[] end | select(.name==$n) | .id' /tmp/pods-before.json)
          if [ "${#ids[@]}" -gt 1 ]; then
            echo "More than one exact-name pod exists; refusing to modify or create anything."
            exit 19
          fi
          if [ "${#ids[@]}" -eq 1 ]; then
            existing_id="${ids[0]}"
            if [ "$existing_id" != "$KNOWN_TASK_POD_ID" ]; then
              echo "An exact-name pod exists but it is not the pod created by this deployment task. Refusing to alter it: $existing_id"
              exit 18
            fi
            curl -fsS --max-time 20 -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              "https://rest.runpod.io/v1/pods/${existing_id}" > /tmp/target-before.json
            jq -e --arg n "$POD_NAME" --arg img "$IMAGE" '
              .id=="at0lgrx9aqiypm" and .name==$n and ((.imageName // .image)==$img) and (.cpuFlavorId != null)
            ' /tmp/target-before.json >/dev/null || {
              echo "Existing task pod identity/config does not match expected CPU Open WebUI target. Refusing to alter it."
              exit 17
            }
            echo "Using task-owned pod: $existing_id"
            echo "pod_id=$existing_id" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -n \
            --arg name "$POD_NAME" \
            --arg image "$IMAGE" \
            '{
              name:$name,
              imageName:$image,
              computeType:"CPU",
              cloudType:"SECURE",
              cpuFlavorIds:["cpu3g","cpu3c"],
              cpuFlavorPriority:"availability",
              vcpuCount:2,
              containerDiskInGb:20,
              volumeInGb:20,
              volumeMountPath:"/app/backend/data",
              ports:["8080/http"],
              env:{
                PORT:"8080",
                HOST:"0.0.0.0",
                WEBUI_AUTH:"True",
                WEBUI_SECRET_KEY_FILE:"/app/backend/data/.webui_secret_key",
                WEBUI_SECRET_KEY_LENGTH:"48",
                SCARF_NO_ANALYTICS:"true",
                DO_NOT_TRACK:"true",
                ANONYMIZED_TELEMETRY:"false",
                PYTHONUNBUFFERED:"1"
              }
            }' > /tmp/create-pod.json

          http=$(curl -sS --max-time 40 -o /tmp/create-response.json -w '%{http_code}' \
            -X POST https://rest.runpod.io/v1/pods \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/create-pod.json)
          cat /tmp/create-response.json | jq '.' || cat /tmp/create-response.json
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            echo "RunPod create failed with HTTP $http"
            exit 20
          fi
          pod_id=$(jq -r '.id // empty' /tmp/create-response.json)
          if [ -z "$pod_id" ]; then
            echo "Create response did not contain a pod id."
            exit 21
          fi
          echo "pod_id=$pod_id" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created new CPU-only pod: $pod_id"

      - name: Enforce 20 GB persistent Pod volume at /app/backend/data
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='${{ steps.target.outputs.pod_id }}'
          curl -fsS --max-time 20 -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            "https://rest.runpod.io/v1/pods/${POD_ID}" > /tmp/pod-storage-before.json
          current_volume=$(jq -r '.volumeInGb // 0' /tmp/pod-storage-before.json)
          current_mount=$(jq -r '.volumeMountPath // ""' /tmp/pod-storage-before.json)
          echo "Current Pod volume: ${current_volume} GB mounted at ${current_mount:-<none>}"

          if [ "$current_volume" -ge 20 ] && [ "$current_mount" = "/app/backend/data" ]; then
            echo "Required persistent Pod volume is already configured."
            exit 0
          fi

          jq --arg n "$POD_NAME" --arg img "$IMAGE" '
            {
              containerDiskInGb:(.containerDiskInGb // 20),
              imageName:$img,
              name:$n,
              ports:["8080/http"],
              volumeInGb:20,
              volumeMountPath:"/app/backend/data",
              env:((.env // {}) + {
                PORT:"8080",
                HOST:"0.0.0.0",
                WEBUI_AUTH:"True",
                WEBUI_SECRET_KEY_FILE:"/app/backend/data/.webui_secret_key",
                WEBUI_SECRET_KEY_LENGTH:"48",
                SCARF_NO_ANALYTICS:"true",
                DO_NOT_TRACK:"true",
                ANONYMIZED_TELEMETRY:"false",
                PYTHONUNBUFFERED:"1"
              })
            }
            + (if (.containerRegistryAuthId // "") != "" then {containerRegistryAuthId:.containerRegistryAuthId} else {} end)
          ' /tmp/pod-storage-before.json > /tmp/update-pod.json

          http=$(curl -sS --max-time 40 -o /tmp/update-response.json -w '%{http_code}' \
            -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/update" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/update-pod.json)
          cat /tmp/update-response.json | jq '{id,name,imageName,desiredStatus,volumeInGb,volumeMountPath,cpuFlavorId,ports}' || cat /tmp/update-response.json
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            echo "RunPod persistent-volume update failed with HTTP $http"
            exit 24
          fi

          for i in $(seq 1 30); do
            sleep 5
            curl -fsS --max-time 20 -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              "https://rest.runpod.io/v1/pods/${POD_ID}" > /tmp/pod-storage-after.json || continue
            vol=$(jq -r '.volumeInGb // 0' /tmp/pod-storage-after.json)
            mnt=$(jq -r '.volumeMountPath // ""' /tmp/pod-storage-after.json)
            status=$(jq -r '.desiredStatus // "unknown"' /tmp/pod-storage-after.json)
            echo "Storage check $i: status=$status volume=${vol}GB mount=$mnt"
            if [ "$vol" -ge 20 ] && [ "$mnt" = "/app/backend/data" ]; then
              echo "Persistent Pod volume confirmed."
              exit 0
            fi
          done
          echo "RunPod did not report the required persistent Pod volume after update."
          exit 25

      - name: Wait for Open WebUI health through RunPod proxy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='${{ steps.target.outputs.pod_id }}'
          URL="https://${POD_ID}-8080.proxy.runpod.net"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 120); do
            pod_json=$(curl -sS --max-time 15 -H "Authorization: Bearer ${RUNPOD_API_KEY}" "https://rest.runpod.io/v1/pods/${POD_ID}" || true)
            desired=$(printf '%s' "$pod_json" | jq -r '.desiredStatus // "unknown"' 2>/dev/null || echo unknown)
            echo "Attempt $i: desiredStatus=$desired"
            if curl -fsS --max-time 15 "$URL/health" -o /tmp/health.json; then
              cat /tmp/health.json
              if jq -e '.status == true' /tmp/health.json >/dev/null 2>&1; then
                echo "Open WebUI health endpoint is ready."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Open WebUI did not become healthy through the RunPod proxy."
          exit 30

      - name: Inspect RunPod startup logs
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='${{ steps.target.outputs.pod_id }}'
          LOG_URL="https://v2-rest.runpod.io/v2/pods/${POD_ID}/logs"
          set +e
          http=$(curl -sS -N --max-time 15 -o /tmp/pod-logs.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" "$LOG_URL")
          rc=$?
          set -e
          echo "RunPod log endpoint curl_rc=$rc http=${http:-none} bytes=$(wc -c < /tmp/pod-logs.txt 2>/dev/null || echo 0)"
          if [ -s /tmp/pod-logs.txt ]; then
            echo "--- RunPod startup log sample ---"
            tail -n 160 /tmp/pod-logs.txt | sed -E 's/(Bearer|api[_-]?key|token)[=: ]+[^ ]+/\1=[REDACTED]/Ig'
            echo "--- end startup log sample ---"
          fi
          if [ "${http:-0}" != "200" ] || [ ! -s /tmp/pod-logs.txt ]; then
            echo "RunPod startup logs were not retrievable."
            exit 35
          fi
          grep -q 'v0.11.1 - building the best AI user interface' /tmp/pod-logs.txt || {
            echo "Open WebUI v0.11.1 startup signature not found in logs."
            exit 36
          }
          grep -Eq 'Started server process|Application startup complete|Scheduler worker started' /tmp/pod-logs.txt || {
            echo "Open WebUI server-start signature not found in logs."
            exit 37
          }
          echo "Startup logs inspected successfully."

      - name: Verify external Open WebUI authentication page
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.verify.outputs.url }}'
          curl -fsS --max-time 20 "$URL/" -o /tmp/index.html
          echo "External root HTTP check passed."
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "No headless Chrome binary available on runner."
            exit 40
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=20000 --dump-dom "$URL/" > /tmp/dom.html 2>/tmp/chrome.err || {
              cat /tmp/chrome.err
              exit 41
            }
          if grep -Eiq 'sign in|sign up|log in|Open WebUI|get started' /tmp/dom.html; then
            echo "Rendered Open WebUI authentication page verified externally."
            grep -Eio '.{0,80}(sign in|sign up|log in|Open WebUI|get started).{0,80}' /tmp/dom.html | head -n 10 || true
          else
            echo "Rendered page did not contain expected Open WebUI/authentication text."
            head -n 80 /tmp/dom.html
            exit 42
          fi

      - name: Confirm deployment invariants
        shell: bash
        run: |
          set -euo pipefail
          POD_ID='${{ steps.target.outputs.pod_id }}'
          curl -fsS --max-time 20 -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            "https://rest.runpod.io/v1/pods/${POD_ID}" > /tmp/final-pod.json

          jq '{id,name,imageName,desiredStatus,ports,volumeInGb,volumeMountPath,vcpuCount,cpuFlavorId,gpuCount,gpu,env}' /tmp/final-pod.json \
            | sed -E 's/(WEBUI_SECRET_KEY[^" ]*\"?: ?\")[^\"]+/\1[REDACTED]/g'

          jq -e --arg n "$POD_NAME" --arg img "$IMAGE" '
            .name==$n and
            ((.imageName // .image)==$img) and
            (.desiredStatus=="RUNNING") and
            (.volumeMountPath=="/app/backend/data") and
            ((.volumeInGb // 0) >= 20) and
            ((.ports // []) | index("8080/http") != null) and
            (.cpuFlavorId != null) and
            ((.gpuCount // 0) == 0) and
            (((.gpu // null) == null) or ((.gpu.count // 0) == 0)) and
            ((.env.WEBUI_SECRET_KEY_FILE // "")=="/app/backend/data/.webui_secret_key") and
            ((.env.WEBUI_SECRET_KEY_LENGTH // "")=="48") and
            ((.env.WEBUI_AUTH // "")=="True")
          ' /tmp/final-pod.json >/dev/null

          curl -fsS --max-time 20 "${{ steps.verify.outputs.url }}/health" | jq -e '.status==true' >/dev/null
          echo "CPU-only, persistent storage, secret-key file, image, health and proxy-port assertions passed."
          echo "External URL: ${{ steps.verify.outputs.url }}"
          echo "Deployment verification complete."
