name: Upgrade Open WebUI on RunPod

on:
  push:
    branches:
      - ops/runpod-openwebui-20260904
    paths:
      - .github/workflows/runpod-openwebui-deploy.yml

permissions:
  contents: read

concurrency:
  group: runpod-openwebui-20260904
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY_RAW: ${{ secrets.RUNPOD_API_KEY || secrets.RUNPOD_KEY || secrets.RUNPOD_TOKEN }}
      POD_ID: at0lgrx9aqiypm
      POD_NAME: open-webui-v0-11-1-cpu-20260904
      TARGET_IMAGE: ghcr.io/open-webui/open-webui:v0.11.3
      TARGET_VERSION: v0.11.3
    steps:
      - name: Normalize RunPod credential
        shell: bash
        run: |
          set -euo pipefail
          raw="${RUNPOD_API_KEY_RAW:-}"
          [ -n "$raw" ] || { echo "No RunPod Actions secret found."; exit 10; }
          key=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]*[Aa]uthorization:[[:space:]]*//; s/^[[:space:]]*[Bb]earer[[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')
          [ -n "$key" ] || { echo "RunPod secret is empty after normalization."; exit 11; }
          echo "::add-mask::$key"
          echo "RUNPOD_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Snapshot all RunPod pods before upgrade
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            https://rest.runpod.io/v1/pods > /tmp/pods-before.json
          jq -S '[if type=="array" then .[] else (.pods // [])[] end | {id,name,desiredStatus,imageName,volumeInGb,volumeMountPath}]' \
            /tmp/pods-before.json > /tmp/pods-before-normalized.json
          jq '.' /tmp/pods-before-normalized.json

      - name: Verify target ownership and current configuration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            "https://rest.runpod.io/v1/pods/${POD_ID}" > /tmp/target-before.json
          jq -e --arg id "$POD_ID" --arg n "$POD_NAME" '
            .id==$id and
            .name==$n and
            (.cpuFlavorId != null) and
            ((.gpuCount // 0) == 0) and
            (((.gpu // null) == null) or ((.gpu.count // 0) == 0)) and
            (.volumeMountPath=="/app/backend/data") and
            ((.volumeInGb // 0) >= 20) and
            ((.ports // []) | index("8080/http") != null) and
            ((.env.WEBUI_SECRET_KEY_FILE // "")=="/app/backend/data/.webui_secret_key")
          ' /tmp/target-before.json >/dev/null || {
            echo "Target pod identity or safety invariants do not match; refusing upgrade."
            exit 17
          }
          current=$(jq -r '.imageName // .image // ""' /tmp/target-before.json)
          case "$current" in
            ghcr.io/open-webui/open-webui:v0.11.1|ghcr.io/open-webui/open-webui:v0.11.2|ghcr.io/open-webui/open-webui:v0.11.3) ;;
            *) echo "Unexpected target image: $current. Refusing upgrade."; exit 18 ;;
          esac
          echo "Verified task-owned CPU pod. Current image: $current"

      - name: Upgrade only the task-owned pod to v0.11.3
        shell: bash
        run: |
          set -euo pipefail
          current=$(jq -r '.imageName // .image // ""' /tmp/target-before.json)
          if [ "$current" = "$TARGET_IMAGE" ]; then
            echo "Target is already on $TARGET_IMAGE; no image update needed."
            exit 0
          fi

          jq --arg img "$TARGET_IMAGE" '
            {
              containerDiskInGb:(.containerDiskInGb // 20),
              imageName:$img,
              name:.name,
              ports:(.ports // ["8080/http"]),
              volumeInGb:(.volumeInGb // 20),
              volumeMountPath:(.volumeMountPath // "/app/backend/data"),
              env:(.env // {})
            }
            + (if (.containerRegistryAuthId // "") != "" then {containerRegistryAuthId:.containerRegistryAuthId} else {} end)
          ' /tmp/target-before.json > /tmp/upgrade-pod.json

          http=$(curl -sS --max-time 45 -o /tmp/upgrade-response.json -w '%{http_code}' \
            -X POST "https://rest.runpod.io/v1/pods/${POD_ID}/update" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/upgrade-pod.json)
          cat /tmp/upgrade-response.json | jq '{id,name,imageName,desiredStatus,volumeInGb,volumeMountPath,cpuFlavorId,ports}' || cat /tmp/upgrade-response.json
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            echo "RunPod image upgrade failed with HTTP $http"
            exit 20
          fi

      - name: Wait for v0.11.3 and health through RunPod proxy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${POD_ID}-8080.proxy.runpod.net"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 120); do
            curl -fsS --max-time 15 -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              "https://rest.runpod.io/v1/pods/${POD_ID}" > /tmp/pod-now.json || true
            img=$(jq -r '.imageName // .image // "unknown"' /tmp/pod-now.json 2>/dev/null || echo unknown)
            status=$(jq -r '.desiredStatus // "unknown"' /tmp/pod-now.json 2>/dev/null || echo unknown)
            echo "Attempt $i: status=$status image=$img"
            if [ "$img" = "$TARGET_IMAGE" ] && [ "$status" = "RUNNING" ]; then
              if curl -fsS --max-time 15 "$URL/health" -o /tmp/health.json; then
                cat /tmp/health.json
                if jq -e '.status == true' /tmp/health.json >/dev/null 2>&1; then
                  echo "Open WebUI v0.11.3 pod is healthy."
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "Open WebUI v0.11.3 did not become healthy."
          exit 30

      - name: Inspect v0.11.3 startup logs
        shell: bash
        run: |
          set -euo pipefail
          LOG_URL="https://v2-rest.runpod.io/v2/pods/${POD_ID}/logs"
          set +e
          http=$(curl -sS -N --max-time 15 -o /tmp/pod-logs.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" "$LOG_URL")
          rc=$?
          set -e
          echo "RunPod log endpoint curl_rc=$rc http=${http:-none} bytes=$(wc -c < /tmp/pod-logs.txt 2>/dev/null || echo 0)"
          [ "${http:-0}" = "200" ] && [ -s /tmp/pod-logs.txt ] || { echo "Startup logs unavailable."; exit 35; }
          tail -n 180 /tmp/pod-logs.txt | sed -E 's/(Bearer|api[_-]?key|token)[=: ]+[^ ]+/\1=[REDACTED]/Ig'
          grep -q 'v0.11.3 - building the best AI user interface' /tmp/pod-logs.txt || {
            echo "Open WebUI v0.11.3 startup signature not found."
            exit 36
          }
          grep -Eq 'Started server process|Application startup complete|Scheduler worker started' /tmp/pod-logs.txt || {
            echo "Server-start signature not found."
            exit 37
          }
          if grep -Eiq 'migration.*(error|failed)|traceback|fatal' /tmp/pod-logs.txt; then
            echo "Potential fatal/migration error detected in startup logs."
            exit 38
          fi
          echo "v0.11.3 startup logs inspected successfully."

      - name: Verify external authentication page in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ steps.verify.outputs.url }}'
          curl -fsS --max-time 20 "$URL/" -o /tmp/index.html
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          [ -n "$CHROME" ] || { echo "No headless Chrome binary available."; exit 40; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=20000 --dump-dom "$URL/" > /tmp/dom.html 2>/tmp/chrome.err || {
              cat /tmp/chrome.err
              exit 41
            }
          grep -Eiq 'sign in|sign up|log in|Open WebUI|get started' /tmp/dom.html || {
            echo "Expected Open WebUI authentication text not found."
            exit 42
          }
          echo "External Open WebUI authentication page rendered successfully."

      - name: Confirm final invariants and unrelated pods unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            "https://rest.runpod.io/v1/pods/${POD_ID}" > /tmp/final-pod.json
          jq -e --arg id "$POD_ID" --arg img "$TARGET_IMAGE" '
            .id==$id and
            ((.imageName // .image)==$img) and
            (.desiredStatus=="RUNNING") and
            (.cpuFlavorId != null) and
            ((.gpuCount // 0) == 0) and
            (((.gpu // null) == null) or ((.gpu.count // 0) == 0)) and
            (.volumeMountPath=="/app/backend/data") and
            ((.volumeInGb // 0) >= 20) and
            ((.ports // []) | index("8080/http") != null) and
            ((.env.WEBUI_AUTH // "")=="True") and
            ((.env.WEBUI_SECRET_KEY_FILE // "")=="/app/backend/data/.webui_secret_key") and
            ((.env.WEBUI_SECRET_KEY_LENGTH // "")=="48")
          ' /tmp/final-pod.json >/dev/null

          curl -fsS --max-time 20 -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            https://rest.runpod.io/v1/pods > /tmp/pods-after.json
          jq -S --arg id "$POD_ID" '[if type=="array" then .[] else (.pods // [])[] end | select(.id!=$id) | {id,name,desiredStatus,imageName,volumeInGb,volumeMountPath}]' \
            /tmp/pods-before.json > /tmp/unrelated-before.json
          jq -S --arg id "$POD_ID" '[if type=="array" then .[] else (.pods // [])[] end | select(.id!=$id) | {id,name,desiredStatus,imageName,volumeInGb,volumeMountPath}]' \
            /tmp/pods-after.json > /tmp/unrelated-after.json
          diff -u /tmp/unrelated-before.json /tmp/unrelated-after.json

          curl -fsS --max-time 20 "https://${POD_ID}-8080.proxy.runpod.net/health" | jq -e '.status==true' >/dev/null
          jq '{id,name,imageName,desiredStatus,ports,volumeInGb,volumeMountPath,vcpuCount,cpuFlavorId,gpuCount,gpu}' /tmp/final-pod.json
          echo "Upgrade verification complete: v0.11.3, CPU-only, persistent storage preserved, unrelated pods unchanged."
          echo "External URL: https://${POD_ID}-8080.proxy.runpod.net"
