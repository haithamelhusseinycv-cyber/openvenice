name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test web application
        run: npm run test:run

      - name: Test Shahy routing and security behavior
        run: python3 -m unittest shahy-webui/test_shahy_pipe.py

      - name: Test VoiceTut security layer
        run: python3 -m unittest discover -s services/voicetut-api -p 'test_*.py'

      - name: Build
        run: npm run build

      - name: Verify privileged proxy hardening
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'OPENVENICE_ACCESS_TOKEN' scripts/openvenice-start.sh
          grep -q 'X-OpenVenice-Access' src/connectors/http-transport.ts
          grep -q 'X-OpenVenice-Access' src/lib/venice-client.ts
          grep -q 'return 401' nginx.connectors.conf.template
          grep -q 'return 401' nginx.voicetut.conf.template
          grep -q 'limit_req zone=openvenice_api' nginx.connectors.conf.template
          grep -q 'limit_req zone=openvenice_api' nginx.voicetut.conf.template
