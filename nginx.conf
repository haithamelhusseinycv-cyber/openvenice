server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain application/javascript text/css application/json image/svg+xml;

  # Keep security headers at server scope. Child locations intentionally avoid
  # add_header so Nginx does not drop this inherited set.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://api.venice.ai blob: data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=()" always;

  # Vite's entry document must revalidate so deploys pick up new hashed assets.
  # `expires -1` emits Cache-Control: no-cache without shadowing server headers.
  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite asset names are content-hashed, so long-lived caching is safe.
  location ~* \.(?:js|css|svg|woff2?)$ {
    expires 1y;
  }
}
